[project]
name = "ai-equities-desk"
version = "2.0.0"
description = "AI Equities Desk — consensus ratings, walk-forward backtest, options ideas"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.40",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "requests>=2.31",
    "joblib>=1.3",
    "python-dateutil>=2.8",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "flask>=3.0",
    "lxml>=5.0",
    "html5lib>=1.1",
    "beautifulsoup4>=4.12",
    "psycopg[binary,pool]>=3.1",
]

[tool.vercel]
entrypoint = "asgi:app"
